# ============================================================================
# API 进程配置
#
# 运行方式：在 AgentServer/ 目录下
#   mvn.cmd -pl remaster-agent-web spring-boot:run
# 该进程只写状态与投递队列，不执行迁移（除非显式打开 worker.embedded）
# ============================================================================

server:
  port: ${REMASTER_API_PORT:8080}

spring:
  application:
    name: remaster-agent-api

  # 见 worker 的 application.yml —— 三路径是为了适配不同的启动工作目录
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:remaster}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      pool-name: remaster-api-pool
      maximum-pool-size: 10

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 命令超时必须 > 队列阻塞读取时长（QueueProperties.blockMillis 默认 5000ms）。
      # 设 3s 会导致空闲时 XREADGROUP 每轮在 3s 处被 Lettuce 打断并报 RedisCommandTimeoutException。
      timeout: 10s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true

  jackson:
    # 时间统一用 ISO-8601 字符串而不是时间戳数字：前端的 Date 解析、日志、curl 调试
    # 都更可读，而序列化体积在这个量级完全不是问题
    serialization:
      write-dates-as-timestamps: false

remaster:
  core:
    max-rewrite-attempts: 2
    # 见 worker 的同名项。API 进程自身不跑沙箱（除非 worker.embedded=true 内嵌了 Worker），
    # 但配置需齐备 —— 内嵌模式下这里就是实际生效的值，且必须与 Worker 指向同一处。
    # 必须是绝对路径（相对路径会随进程工作目录漂移）；部署时用 REMASTER_WORKSPACE_ROOT 覆盖。
    workspace-root: ${REMASTER_WORKSPACE_ROOT:E:/AITools/WorkBuddy/workspace/langchain-agent-java/.remaster-workspaces}
    # 沙箱回收（见 worker 的同名项）。API 进程自身不扫（除非内嵌了 Worker —— 那时它才是沙箱的
    # 创建者，由它来扫），但配置需齐备：内嵌模式下这里就是实际生效的值，且必须与 Worker 一致。
    workspace-cleanup-enabled: ${REMASTER_WORKSPACE_CLEANUP_ENABLED:true}
    workspace-retention: ${REMASTER_WORKSPACE_RETENTION:24h}

  # 代码 RAG（阶段 2 理解层）。API 进程不执行检索，但配置需齐备（见下 sandbox 的同款说明）。
  rag:
    enabled: ${REMASTER_RAG_ENABLED:true}
    top-k: ${REMASTER_RAG_TOP_K:6}
    candidate-k: ${REMASTER_RAG_CANDIDATE_K:20}
    rrf-k: ${REMASTER_RAG_RRF_K:60}
    neighbor-depth: ${REMASTER_RAG_NEIGHBOR_DEPTH:1}

  # API 进程不跑沙箱，但装配 SandboxExecutor 时仍会读这些值做校验，
  # 所以必须配齐（否则 SandboxConfig 会拿到 null）
  sandbox:
    mode: ${SANDBOX_MODE:local}
    memory-limit-mb: ${SANDBOX_MEMORY_LIMIT_MB:1024}
    timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:600}
    maven-home: ${MAVEN_HOME}
    maven-settings: ${MAVEN_SETTINGS}
    maven-local-repo: ${MAVEN_LOCAL_REPO}
    docker:
      image: ${SANDBOX_DOCKER_IMAGE:}
      user: ${SANDBOX_DOCKER_USER:}
      pids-limit: ${SANDBOX_DOCKER_PIDS_LIMIT:256}
      cpus: ${SANDBOX_DOCKER_CPUS:}
      container-workspace: ${SANDBOX_DOCKER_CONTAINER_WORKSPACE:}
      container-maven-repo: ${SANDBOX_DOCKER_CONTAINER_MAVEN_REPO:}
      container-settings: ${SANDBOX_DOCKER_CONTAINER_SETTINGS:}

  llm:
    base-url: ${LLM_BASE_URL}
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    rewrite-model: ${LLM_MODEL_REWRITE}
    # 见 worker 的 application.yml —— 超时、重试次数、退避与总预算都在那里有完整说明。
    # API 侧不直接调大模型，但保留同一组配置，避免两个进程对同一份 .env 的解释不一致。
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
    max-retries: ${LLM_MAX_RETRIES:2}
    retry-backoff-millis: ${LLM_RETRY_BACKOFF_MILLIS:2000}
    call-budget-seconds: ${LLM_CALL_BUDGET_SECONDS:420}
    # 见 worker 的 application.yml —— 留空则向量路禁用
    embedding-model: ${LLM_EMBEDDING_MODEL:}
    embedding-dimensions: ${LLM_EMBEDDING_DIMENSIONS:}
    # 向量模型的专用网关与 Key；留空则复用上面的 base-url / api-key（见 worker 的说明）
    embedding-base-url: ${LLM_EMBEDDING_BASE_URL:}
    embedding-api-key: ${LLM_EMBEDDING_API_KEY:}
    # 见 worker 的 application.yml 说明
    input-price-per-million: ${LLM_INPUT_PRICE:0}
    output-price-per-million: ${LLM_OUTPUT_PRICE:0}
    # 上下文治理（输入侧 token 预算，见 worker 的 application.yml 说明）。
    # API 侧不调模型，但保留同一组配置，避免两个进程对同一份 .env 的解释不一致。
    context:
      max-tokens: ${LLM_CONTEXT_MAX_TOKENS:3000}
      enabled: ${LLM_CONTEXT_ENABLED:true}

  worker:
    # true = Worker 跑在 API 进程内（开发省事）；部署与演示请设 false，用独立 Worker 进程。
    # 两种方式共用同一个 TaskConsumer 和同一个 Redis Stream，只是进程边界不同
    embedded: ${REMASTER_WORKER_EMBEDDED:false}

  queue:
    stream-key: remaster:tasks
    consumer-group: remaster-workers
    batch-size: 1
    block-millis: 5000
    reclaim-min-idle-seconds: 60

  web:
    allowed-origins: ${REMASTER_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    sse-heartbeat-millis: 20000
    # 进度订阅链路探活（见 ProgressLinkWatchdog）。
    # ping 间隔要明显小于 stale 阈值：至少要能容忍连丢两次心跳才判死，否则网络一抖就重建订阅。
    # 15s / 45s 意味着「连续 3 次心跳都没回来」才动手，同时保证缓存被回收后 1 分钟内自愈。
    progress-ping-millis: ${REMASTER_PROGRESS_PING_MILLIS:15000}
    progress-stale-millis: ${REMASTER_PROGRESS_STALE_MILLIS:45000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.remasteragent: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
