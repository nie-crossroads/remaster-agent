# RemasterAgent 迁移评测集 —— 用例清单
#
# 这个文件是评测集的「唯一事实来源」：harness 只认它，报告里的分母也由它决定。
# 每条用例 = 一个迁移任务 = 一个（工程, 目标文件）二元组。
#
# 字段：
#   id          唯一标识，报告里作为行的主键，也用于 --case=<id> 指定单跑
#   project     工程根目录，相对仓库根，必须含 pom.xml
#   entryFile   目标文件，相对 project，必须以 .java 结尾
#   targetJdk   目标 JDK 版本
#   expect      期望结局：SUCCEEDED / FAILED
#   ready       true = 样本已就绪可跑；false = 计划中（B2 补），harness 会跳过并计入「未就绪」
#   title       一句话说明这条用例在考什么
#   patterns    覆盖的遗留模式标签（报告按标签分组，验证「哪类改动最难」）
#   notes       样本设计上的关键约束，写给维护者看
#
# 口径纪律：验收标准里的「≥ 20 个可迁移目标」只统计 ready: true 的条目。
# 把「计划」和「就绪」分开记，是为了避免「条目数够了但其实跑不了」这种自欺。

version: 1

cases:

  # ==================================================================
  # billing-legacy —— 计费域（B1 已就绪）
  # ==================================================================
  # 硬约束（见 docs/PHASE4_EVAL_DESIGN.md §2.3）：同工程内四个类互不调用，
  # 每个测试类只测自己。因为 VERIFY 跑的是全工程 mvn test，
  # 一旦 A 类的改写会影响 B 类的单测，A 就会被判失败 —— 那是样本的锅，不是 Agent 的。

  - id: billing-invoice-calculator
    project: examples/eval/billing-legacy
    entryFile: src/main/java/com/example/billing/InvoiceCalculator.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 金额精度（内部 double → BigDecimal）与显式装箱
    patterns: [money-double, boxing, explicit-generics, index-loop, string-concat]
    notes: >
      金额的对外表示刻意定为「整数分」，精度问题完全落在实现内部 ——
      否则换成 BigDecimal 会动到公开签名，被 API 护栏拦住，那不是能力测试而是送死题。

  - id: billing-payment-schedule
    project: examples/eval/billing-legacy
    entryFile: src/main/java/com/example/billing/PaymentSchedule.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 日期时间迁移（Date/Calendar/SimpleDateFormat → java.time），含月末钳位
    patterns: [date-time, calendar-dow, index-loop]
    notes: >
      两处语义陷阱被刻意保留并钉住：① 月末加月的钳位（2024-01-31 +1 月 = 2024-02-29）；
      ② Calendar 的 1=周日 与 ISO 的 1=周一。另注意星期名用 Locale.ENGLISH —— 
      本 JDK 的 Locale.ROOT 星期名只有缩写，locale 被顺手改回 ROOT 会让输出变短。
      同文件里还有个共享的 static SimpleDateFormat（线程安全地雷）与「每次新建」的正确写法作对照。

  - id: billing-tax-rule-engine
    project: examples/eval/billing-legacy
    entryFile: src/main/java/com/example/billing/TaxRuleEngine.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 匿名内部类 Comparator → lambda，循环内字符串拼接 → text block / join
    patterns: [anonymous-inner-class, comparator, string-concat, collections-sort, explicit-generics, enumeration-iterator]
    notes: >
      排序比较器写成全序（起点 → 税率 → 加入序），使输出与「排序是否稳定」无关；
      税额一律整数向下取整，断言用精确值。
      档位下界是闭区间，每个起点都测「刚好够」与「差一分」。

  - id: billing-refund-ledger
    project: examples/eval/billing-legacy
    entryFile: src/main/java/com/example/billing/RefundLedger.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 旧集合走查（Hashtable/Vector/Stack → HashMap/ArrayList/ArrayDeque）
    patterns: [legacy-collections, enumeration-iterator, comparator, boxing, string-concat]
    notes: >
      排序比较器带订单号 tie-break —— 否则金额相同的订单先后会取决于底层 map 迭代顺序，
      而 Hashtable 与 HashMap 迭代顺序一般不同，模型做对每件事也会假失败。
      复核队列按 LIFO 语义钉住（Stack.pop ↔ ArrayDeque.pop 是一对一替换，换成 removeFirst 就成队列了）。

