    notes: >
      低库存清单按「库存升序 + sku 字典序」输出 —— Hashtable 与 HashMap 迭代顺序不同，
      不定序的话模型每件事都做对也会假失败。流水返回防御性拷贝，由单测钉住。

  - id: inventory-sku-index
    project: examples/eval/inventory-legacy
    entryFile: src/main/java/com/example/inventory/SkuIndex.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 手写二分查找与 Arrays 旧用法 → Arrays.binarySearch / 泛型方法
    patterns: [explicit-generics, index-loop, boxing]
    notes: >
      最要紧的一条契约：查不到返回 -1，而不是 Arrays.binarySearch 的「插入点编码」
      （-(insertionPoint)-1）。直接照搬二分会让 indexOf 在缺货时返回负数 ——
      这是迁移里最容易顺手引入的回归，单测专门盯它。

  - id: inventory-movement-log
    project: examples/eval/inventory-legacy
    entryFile: src/main/java/com/example/inventory/MovementLog.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 手写扩容数组 → ArrayList / 集合工厂方法
    patterns: [index-loop, explicit-generics, string-concat]
    notes: >
      capacity() 把「扩容是否发生」变成可观测行为并钉住。换成 ArrayList 后容量不再可观测，
      迁移时必须显式回答「这个性质还要不要」，而不是让它悄悄消失。

  - id: inventory-reorder-rules
    project: examples/eval/inventory-legacy
    entryFile: src/main/java/com/example/inventory/ReorderRules.java
    targetJdk: 21
    expect: SUCCEEDED
    ready: true
    title: 匿名内部类 Predicate 过滤 → lambda / Stream.filter
    patterns: [anonymous-inner-class, comparator, legacy-collections]
    notes: >
      自带 Filter 接口是这个类的「时代指纹」。正确迁移是保留它作为对外契约、内部换成 lambda ——
      换成 java.util.function.Predicate 会动公开签名，被 API 护栏拦住。
      skusNeedingReorder 的结果按字典序，与容器插入顺序无关。

