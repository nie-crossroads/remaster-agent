    patterns: [date-time, anonymous-inner-class, legacy-collections, string-concat, boxing]
    notes: 单文件内的耦合型样本，用于对照 billing-legacy 那种「同工程多文件解耦」的形态。

  # ==================================================================
  # 负样本 —— 期望失败（这一组决定了成功率的分子有没有意义）
  # ==================================================================
  # 只跑正样本的评测集无法区分「Agent 真的会改」与「Agent 永远报成功」。
  # 负样本的作用是给成功率一个分母：3/29 期望失败时，正样本 26/26 才是满分。

  - id: negative-test-compile-fail
    project: examples/legacy-unfixable
    entryFile: src/main/java/com/example/unfixable/LegacyStockLedger.java
    targetJdk: 21
    expect: FAILED
    ready: true
    title: 入口文件可改但工程永远编不过（测试引用了已删除的类）
    patterns: [legacy-collections, boxing]
    notes: >
      考的是失败收敛：ANALYZE / REWRITE 都会成功，VERIFY 必然失败，
      且失败信息指向另一个文件。正确行为是在 max-rewrite-attempts 轮之后停下，
      而不是把预算无限烧在一个不可能的任务上。

