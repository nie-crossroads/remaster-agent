# ============================================================================
# Worker 进程配置
#
# 运行方式：在 AgentServer/ 目录下
#   mvn.cmd -pl remaster-agent-worker spring-boot:run
# 或运行打包后的 jar（工作目录不同，见下面的 config.import 多路径）
# ============================================================================

spring:
  application:
    name: remaster-agent-worker

  # .env 不在 classpath 里（它在仓库根、且被 .gitignore 忽略），所以显式导入。
  # 三个路径是为了让「从模块目录跑」「从 AgentServer 跑」「从仓库根跑」都能找到 ——
  # 相对路径是相对“进程工作目录”解析的，而工作目录取决于怎么启动。
  # [.properties] 是扩展名提示：文件叫 .env，没有它 Spring 不知道该用哪个解析器。
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:remaster}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      pool-name: remaster-worker-pool
      # Worker 是单线程顺序执行任务，不需要大连接池；
      # 池子越小，越容易在压测里立刻暴露「连接没归还」这类问题
      maximum-pool-size: 6

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 命令超时必须【大于】queue.block-millis：XREADGROUP 是阻塞命令，
      # 超时若更短，每次阻塞读都会被客户端判成超时，表现为「队列一直报错但 Redis 是好的」
      timeout: 12s

  # 启动时自动迁移数据库表结构（业务表 + 向量表 repo / code_chunk 同库，
  # 都在 classpath:db/migration 一套脚本里，见 docs/ARCHITECTURE.md ADR-11）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true

remaster:
  core:
    # 最多 2 次重试 = 最多 3 轮改写。每次重试都是一次完整「调模型 + 跑沙箱」，
    # 超过 3 轮通常说明问题不在模型的随机性，而在工程本身，继续只是烧钱
    max-rewrite-attempts: 2
    workspace-root: .remaster-workspaces
    # true = PLAN 成功后把任务挂到 WAITING_HUMAN，等人工在评审界面批准再继续。
    # 默认 false（自动执行）—— 这是「规划人工评审」的开关，验收该能力时置 true。
    # 注意：批准入口在 API 进程（POST /api/tasks/{id}/plan/approve），两个进程读同一个开关，
    # 但只有 Worker 会真的去挂起，所以这个值以 Worker 的配置为准。
    require-plan-approval: ${REMASTER_REQUIRE_PLAN_APPROVAL:false}

  # 代码 RAG（阶段 2 理解层）。enabled=false 可整体关闭检索，是最省钱的降级开关。
  rag:
    enabled: ${REMASTER_RAG_ENABLED:true}
    top-k: ${REMASTER_RAG_TOP_K:6}
    candidate-k: ${REMASTER_RAG_CANDIDATE_K:20}
    rrf-k: ${REMASTER_RAG_RRF_K:60}
    neighbor-depth: ${REMASTER_RAG_NEIGHBOR_DEPTH:1}

  sandbox:
    mode: ${SANDBOX_MODE:local}
    memory-limit-mb: ${SANDBOX_MEMORY_LIMIT_MB:1024}
    timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:600}
    maven-home: ${MAVEN_HOME}
    maven-settings: ${MAVEN_SETTINGS}
    maven-local-repo: ${MAVEN_LOCAL_REPO}

  llm:
    base-url: ${LLM_BASE_URL}
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    rewrite-model: ${LLM_MODEL_REWRITE}
    # 单次 HTTP 请求超时。中转网关延迟波动大（实测首连可接近 10s），太小会误杀正常请求；
    # 但也没必要设得比网关自身的超时阈值更大 —— 上游（实测是 Cloudflare）超阈会直接回 524，
    # 客户端等得更久也拿不到内容。默认 180s，写出来是为了让它成为一个被审视过的数字。
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
    # 失败后最多「再」试几次。注意这不是 SDK 的重试 —— SDK 内层重试已关闭（maxRetries=0），
    # 重试统一由 LlmRetryExecutor 接管，因为只有它能把「正在重试」上报给前端。
    # 上限 2 表示一次调用最多真正发出 3 次请求。
    max-retries: ${LLM_MAX_RETRIES:2}
    # 重试前的退避基准：第 n 次失败后等 base × 2^(n-1)，封顶 30s。
    # 为什么要退避：实测连着两次撞上同一个上游拥塞（两次都是 524），
    # 不留间隔地重试等于把同一个请求立刻再送进同一个瓶颈。
    retry-backoff-millis: ${LLM_RETRY_BACKOFF_MILLIS:2000}
    # 一次调用（含全部重试）的总时间预算，超出即停止重试。
    # 它是「最坏耗时」的硬上限：没有它，上限就是「超时 × 尝试次数」这个乘积。
    # 默认 420s 是按实测数据定的 —— 三次尝试各约 130s、加上退避接近 400s，
    # 留一点余量才不会把「本来第三次能成功」的任务判死。
    call-budget-seconds: ${LLM_CALL_BUDGET_SECONDS:420}
    # 代码 RAG 的向量模型。留空 = 向量路禁用，混合检索退化为「全文 + 符号」两路。
    # 若配置，必须产出 1024 维向量（与 code_chunk.embedding vector(1024) 对齐）。
    embedding-model: ${LLM_EMBEDDING_MODEL:}
    embedding-dimensions: ${LLM_EMBEDDING_DIMENSIONS:}
    # 向量模型的专用网关与 Key。留空则复用上面的 base-url / api-key ——
    # 但向量模型常和 chat 不在同一个网关（本项目的 chat 走中转网关，向量走云厂商 MaaS），
    # 所以这两项通常是要填的，否则 /embeddings 会打到不提供该接口的 chat 网关上。
    embedding-base-url: ${LLM_EMBEDDING_BASE_URL:}
    embedding-api-key: ${LLM_EMBEDDING_API_KEY:}
    # 成本估算单价（每百万 token）。llm_call 表存的是真实 token 用量，
    # 金额由这两个单价换算 —— 所以换模型后必须同步改，否则成本指标会失真。
    # 默认 0：宁可显示「未配置」也不猜一个数，猜出来的成本比没有成本更糟。
    input-price-per-million: ${LLM_INPUT_PRICE:0}
    output-price-per-million: ${LLM_OUTPUT_PRICE:0}

  queue:
    stream-key: remaster:tasks
    consumer-group: remaster-workers
    batch-size: 1
    block-millis: 5000
    # 超过 60 秒未确认的消息视为「上一个 Worker 被杀留下的」，由本实例接管重跑。
    # 不能设得太小：正在跑的任务可能长时间不产生新消息（比如沙箱构建），
    # 阈值太小会把「活着但很慢」误判成「死了」
    reclaim-min-idle-seconds: 60

logging:
  level:
    root: INFO
    com.remasteragent: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
